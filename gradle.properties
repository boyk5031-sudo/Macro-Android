# JVM settings for the Gradle daemon (CI runners have 16 GB; local machines should override in ~/.gradle/gradle.properties if needed).
org.gradle.jvmargs=-Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Xmx4g
kotlin.daemon.jvmargs=-Dfile.encoding=UTF-8 -XX:+UseG1GC -Xmx3g

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=fail

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# --- AGP 9 toolchain mode (ADR-0002) ---------------------------------------------------------
# AGP 9 enables "built-in Kotlin" by default. We opt out and apply the Kotlin Gradle Plugin
# explicitly (2.3.21) so that KSP/Hilt/Room/detekt run in the configuration that is verified today.
# DEADLINE: the opt-out is removed in AGP 10; migrate per ADR-0002 fallback (b) before upgrading.
android.builtInKotlin=false
# Keep the AGP 9 new DSL/Variant API (default). Old Variant API (applicationVariants) is not used anywhere.
android.newDsl=true

# AGP 9 defaults kept explicit for readability (see AGP 9.0 release notes "new defaults").
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false
