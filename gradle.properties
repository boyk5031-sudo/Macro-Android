# JVM settings for the Gradle daemon (CI runners have 16 GB; local machines should override in ~/.gradle/gradle.properties if needed).
org.gradle.jvmargs=-Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Xmx4g
kotlin.daemon.jvmargs=-Dfile.encoding=UTF-8 -XX:+UseG1GC -Xmx3g

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=fail

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# --- AGP 9 toolchain mode (ADR-0002, amended in Phase 2) -------------------------------------
# AGP 9 "built-in Kotlin" is ON (default). The standalone org.jetbrains.kotlin.android plugin is NOT
# applied anywhere: with the AGP 9 new DSL it fails (ClassCastException: LibraryExtensionImpl is not a
# BaseExtension), see CI run 35843924049. The Kotlin *version* is still pinned to the catalog (2.3.21):
# the root build declares org.jetbrains.kotlin.jvm 2.3.21 `apply false`, which puts KGP 2.3.21 on the
# build classpath so AGP's embedded 2.2.10 dependency resolves upward to 2.3.21.
android.builtInKotlin=true
# AGP 9 new DSL/Variant API (default). Old Variant API (applicationVariants) is not used anywhere.
android.newDsl=true

# AGP 9 defaults kept explicit for readability (see AGP 9.0 release notes "new defaults").
android.defaults.buildfeatures.resvalues=false
android.defaults.buildfeatures.shaders=false
