# Versions pinned per docs/phase-1/05-architecture.md §8 (read from live Maven metadata on 2026-09-23).
[versions]
agp = "9.4.1"
kotlin = "2.3.21"
ksp = "2.3.12"
hilt = "2.60.1"
androidxHilt = "1.4.0"
room = "2.8.5"
detekt = "1.23.8"
ktlintGradle = "14.2.0"
ktlintCli = "1.8.0"

composeBom = "2026.09.00"
activityCompose = "1.13.0"
coreKtx = "1.19.0"
coreSplashscreen = "1.2.0"
appcompat = "1.8.0"
lifecycle = "2.11.0"
