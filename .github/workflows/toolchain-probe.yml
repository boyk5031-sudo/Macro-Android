# Phase 0 feasibility probe: verifies that GitHub Actions can serve as the
# Android build/verification environment for this repository. Facts are
# emitted as workflow annotations so they are readable via the Checks API.
# Replaced by the real CI pipeline in Phase 2.
name: toolchain-probe
on:
  push:
    branches: ["arena/**"]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Probe toolchain
        shell: bash
        run: |
          fact() { echo "::notice title=$1::$2"; }
          fact "jdk17" "$("$JAVA_HOME_17_X64/bin/java" -version 2>&1 | head -1)"
          fact "jdk21" "$("$JAVA_HOME_21_X64/bin/java" -version 2>&1 | head -1)"
          fact "platforms_preinstalled" "$(ls "$ANDROID_HOME/platforms" | tr '\n' ' ')"
          fact "build_tools_preinstalled" "$(ls "$ANDROID_HOME/build-tools" | tr '\n' ' ')"
          fact "sdkmanager" "$("$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version 2>/dev/null | head -1)"
          fact "maven_google" "$(curl -s -o /dev/null -w '%{http_code}' https://maven.google.com/)"
          fact "services_gradle" "$(curl -s -o /dev/null -w '%{http_code}' https://services.gradle.org/distributions/)"
          if yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37" "build-tools;36.0.0" >/dev/null 2>&1; then
            fact "sdkmanager_install_37" "ok: $(ls "$ANDROID_HOME/platforms" | tr '\n' ' ')"
          else
            fact "sdkmanager_install_37" "failed"
          fi
          if [ -e /dev/kvm ]; then fact "kvm" "present"; else fact "kvm" "absent"; fi
          fact "runner_resources" "cpus=$(nproc) mem=$(free -g | awk '/Mem:/{print $2}')G disk_free=$(df -h / | awk 'NR==2{print $4}')"
