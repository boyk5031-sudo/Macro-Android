name: ci

on:
  push:
    branches: ["main", "arena/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      instrumented:
        description: "Run instrumented tests on an emulator"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  security-events: write

env:
  GRADLE_OPTS: -Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g
  JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8

jobs:
  build:
    name: build · lint · detekt · unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          validate-wrappers: true

      - name: Toolchain facts
        shell: bash
        run: |
          echo "::notice title=toolchain::$(./gradlew --version | grep -E 'Gradle|Kotlin|JVM' | tr '\n' ' ')"
          echo "::notice title=sdk::platforms=$(ls "$ANDROID_HOME/platforms" | tr '\n' ' ') build-tools=$(ls "$ANDROID_HOME/build-tools" | tr '\n' ' ')"

      - name: Configure (fail fast on plugin/version incompatibility)
        shell: bash
        run: .github/scripts/gradle.sh configure help

      - name: Detekt
        id: detekt
        shell: bash
        continue-on-error: true
        run: .github/scripts/gradle.sh detekt detekt

      - name: Detekt summary
        if: always()
        shell: bash
        run: python3 .github/scripts/detekt_summary.py build/reports/detekt/detekt.xml

      - name: Assemble debug
        shell: bash
        run: .github/scripts/gradle.sh assemble-debug assembleDebug

      - name: Unit tests
        shell: bash
        run: .github/scripts/gradle.sh unit-tests testDebugUnitTest test --continue

      - name: Lint
        shell: bash
        run: .github/scripts/gradle.sh lint lintDebug

      - name: Module boundaries
        shell: bash
        run: .github/scripts/gradle.sh boundaries checkModuleBoundaries

      - name: Forbidden permissions (merged manifest)
        shell: bash
        run: .github/scripts/gradle.sh permissions :app:checkDebugForbiddenPermissions

      - name: Assemble release (unsigned, R8)
        shell: bash
        run: .github/scripts/gradle.sh assemble-release assembleRelease

      - name: Fail if detekt failed
        if: steps.detekt.outcome == 'failure'
        shell: bash
        run: |
          echo "::error title=detekt::detekt reported issues (see 'Detekt summary' annotations)"
          exit 1

      - name: Summarise test results
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET, os
          tests = fails = errs = skips = 0
          failed = []
          for f in glob.glob('**/build/test-results/**/*.xml', recursive=True):
              try:
                  r = ET.parse(f).getroot()
              except Exception:
                  continue
              suites = [r] if r.tag == 'testsuite' else r.findall('testsuite')
              for s in suites:
                  tests += int(s.get('tests', 0)); fails += int(s.get('failures', 0))
                  errs += int(s.get('errors', 0)); skips += int(s.get('skipped', 0))
                  for tc in s.findall('testcase'):
                      if tc.find('failure') is not None or tc.find('error') is not None:
                          failed.append(f"{tc.get('classname')}.{tc.get('name')}")
          print(f"::notice title=unit-tests::total={tests} failures={fails} errors={errs} skipped={skips}")
          for name in failed[:50]:
              print(f"::error title=test-failed::{name}")
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write(f"## Unit tests\n\n| total | failures | errors | skipped |\n|---|---|---|---|\n| {tests} | {fails} | {errs} | {skips} |\n")
              if failed:
                  out.write("\n### Failed\n" + "\n".join(f"- `{n}`" for n in failed) + "\n")
          PY

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          if-no-files-found: ignore
          retention-days: 14
          path: |
            **/build/reports/**
            **/build/test-results/**
            build/reports/detekt/**
            build/ci-logs/**

      - name: Upload APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apks
          retention-days: 14
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt

      - name: Upload detekt SARIF
        if: always() && hashFiles('build/reports/detekt/detekt.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: build/reports/detekt/detekt.sarif
          category: detekt

  instrumented:
    name: instrumented tests (API ${{ matrix.api }})
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && inputs.instrumented)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 34
            target: google_apis
            arch: x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: ./gradlew connectedDebugAndroidTest --continue --stacktrace --no-daemon
      - name: Upload instrumented reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-reports-${{ matrix.api }}
          if-no-files-found: ignore
          path: |
            **/build/reports/androidTests/**
            **/build/outputs/androidTest-results/**
